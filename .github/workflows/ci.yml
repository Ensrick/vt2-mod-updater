name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: build + test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore vt2-mod-updater.sln

      - name: Build
        run: dotnet build vt2-mod-updater.sln -c Release --no-restore

      - name: Test
        run: dotnet test vt2-mod-updater.sln -c Release --no-build --logger "console;verbosity=normal"
